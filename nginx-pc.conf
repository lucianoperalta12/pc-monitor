# ============================================================
# Nginx — Bloque a agregar para PC Monitor
# Agregar DENTRO del bloque server {} existente,
# junto a la directiva location /turnos/ que ya tenés.
# NO modificar nada más.
# ============================================================

    # API de PC Monitor (ASP.NET Core en :5100)
    location /api/ {
        proxy_pass         http://127.0.0.1:5100/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Frontend estático de PC Monitor (Vue buildado)
    location /pc/ {
        alias /var/www/pc-monitor/;
        try_files $uri $uri/ /pc/index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

# ============================================================
# NOTA: Reemplazá /var/www/pc-monitor/ con la ruta donde
# copiés el contenido de PcMonitorFrontend/dist/
# ============================================================
